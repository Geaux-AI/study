<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  var PW='LAbeta1901',KEY='sigep_auth';
  if(sessionStorage.getItem(KEY)==='1') return;
  var style=document.createElement('style');
  style.textContent='body{visibility:hidden!important}';
  document.head.appendChild(style);
  function showGate(){
    style.remove();
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:linear-gradient(135deg,#0d0d1a,#1a1a2e);display:flex;align-items:center;justify-content:center;z-index:9999;font-family:sans-serif';
    ov.innerHTML='<div style="text-align:center;color:#fff;padding:40px;max-width:380px;width:90%">'+
      '<div style="font-size:3rem;color:#c8a028;margin-bottom:8px">ΣΦΕ</div>'+
      '<h2 style="margin:0 0 4px;font-size:1.4rem;letter-spacing:1px">Study Resources</h2>'+
      '<p style="color:rgba(255,255,255,0.55);margin:0 0 28px;font-size:0.88rem">Enter password to access study resources</p>'+
      '<input id="pw-in" type="password" placeholder="Password" style="width:100%;padding:12px 16px;border-radius:8px;border:1px solid rgba(200,160,40,0.4);background:rgba(255,255,255,0.07);color:#fff;font-size:1rem;box-sizing:border-box;outline:none;margin-bottom:12px">'+
      '<button id="pw-btn" style="width:100%;padding:12px;background:#c8a028;color:#0d0d1a;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:10px">Enter</button>'+
      '<p id="pw-err" style="color:#e74c3c;display:none;margin:0;font-size:0.85rem">Incorrect password. Try again.</p>'+
      '</div>';
    document.body.appendChild(ov);
    document.body.style.visibility='visible';
    var inp=document.getElementById('pw-in');
    inp.focus();
    function check(){
      if(inp.value===PW){sessionStorage.setItem(KEY,'1');ov.remove();}
      else{document.getElementById('pw-err').style.display='block';inp.value='';inp.focus();}
    }
    document.getElementById('pw-btn').onclick=check;
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',showGate);}
  else{showGate();}
})();
</script>
